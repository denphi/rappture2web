[build-system]
requires = ["setuptools>=42.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rappture2web"
dynamic = ["version"]
description = "Web-based Rappture tool interface - renders XML tool definitions as interactive web applications"
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "MIT"}
requires-python = ">=3.7"   # pydantic<2 supports 3.7+; pydantic>=2 would need 3.8+
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
dependencies = [
    # pydantic v2 requires pydantic-core (Rust, Python>=3.8).
    # Pin to pydantic v1 + the last FastAPI that supports it so the package
    # installs on Python 3.7 and on platforms without a Rust toolchain.
    "pydantic>=1.10.0,<2.0",
    "fastapi>=0.95.2,<0.100.0",
    "uvicorn>=0.20.0",
    "websockets>=10.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.24.0",
]

[project.scripts]
rappture2web = "rappture2web.cli:main"

[tool.setuptools.dynamic]
version = {attr = "rappture2web._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["rappture2web*"]

[tool.setuptools.package-data]
rappture2web = ["templates/**/*.html", "static/**/*"]
